; AmbiLight firmware - two boards supported
;
;   esp8266-d1-mini  WeMos D1 Mini V2 (ESP8266) over WiFi + UDP   <- primary
;   esp32-c3-supermini  ESP32-C3 SuperMini over USB CDC           <- legacy, still works
;
; Build (PlatformIO is not on PATH; use the penv copy):
;   & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e esp8266-d1-mini
;
; Upload over USB:
;   & "$env:USERPROFILE\.platformio\penv\Scripts\pio.exe" run -e esp8266-d1-mini -t upload
;
; After the first flash you can update over the air from the board's web UI.

[platformio]
; Both environments keep their sources in their own subdirectory.
src_dir = .

[env:esp8266-d1-mini]
platform      = espressif8266@4.2.1
board         = d1_mini
framework     = arduino
board_build.filesystem = littlefs
upload_speed  = 921600
monitor_speed = 115200
build_src_filter = +<esp8266/>
build_flags =
    -D ARDUINO_USB_MODE=0
    ; --- LED output -------------------------------------------------------
    ; Use the hardware-UART WS2812 driver. Without this FastLED bit-bangs the
    ; strip with interrupts disabled, which starves the WiFi stack and makes
    ; the LEDs flicker. See src/esp8266/README.md.
    -D FASTLED_ESP8266_UART
    ; 3.2 Mbps UART = 4 UART bits per 1.25us LED bit (see FastLED source).
    -D FASTLED_ESP8266_UART_BAUD=3200000UL
    ; --- tunables ---------------------------------------------------------
    -D AMBI_MAX_LEDS=512
    -D AMBI_UDP_PORT=7777
    -D AMBI_HOSTNAME=\"ambilight\"
    ; Keep the WiFi stack from sleeping; we are a low-latency receiver.
    -D AMBI_WIFI_TX_POWER=20.5
lib_deps =
    fastled/FastLED@^3.10.0
    ; mDNS + captive portal + OTA UI
    tzapu/WiFiManager@^2.0.17
monitor_filters = esp8266_exception_decoder

[env:esp32-c3-supermini]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
upload_speed  = 921600
monitor_speed = 115200
build_src_filter = +<esp32-c3/>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1
lib_deps =
    fastled/FastLED@^3.7.0
